      summary: Eventos que producen un resultado
      description: |
        `clave` identifica el renglón del resultado (un contacto, una radiobase, un intervalo).
        El número de eventos devuelto coincide siempre con el valor presentado (RF-16).
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-16-AC-1, RF-16-AC-2, RF-23-AC-3, RF-25-AC-3]
      parameters:
        - name: clave
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de eventos de origen; `total` coincide con el valor presentado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEventos'
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/productos/{productoId}/revision:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/ProductoId'
    put:
      tags: [productos]
      operationId: revisarProducto
      summary: Marcar un producto como revisado (coordinador)
      description: |
        Idempotente: repetir la petición deja el mismo estado y no agrega otra entrada a la
        bitácora. La marca se pierde si cambian los parámetros o los datos (RF-18-AC-2).
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-18-AC-1, RF-18-AC-4]
      responses:
        '200':
          description: Producto revisado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/dictamenes:
    parameters:
      - $ref: '#/components/parameters/Folio'
    get:
      tags: [dictamenes]
      operationId: listarDictamenes
      summary: Dictámenes exportados del caso
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: []
      responses:
        '200':
          description: Dictámenes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dictamen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [dictamenes]
      operationId: exportarDictamen
      summary: Componer y exportar un dictamen (PDF y XLSX con un mismo folio)
      description: |
        Genera ambos archivos con encabezado de trazabilidad y las leyendas L-1 y L-2, que no se
        pueden omitir: el esquema no tiene ningún campo para hacerlo (RF-19-AC-3).
      x-roles: [ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-18-AC-3, RF-18-AC-4, RF-19-AC-1, RF-19-AC-2, RF-19-AC-3, RF-19-AC-5, RF-20-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoDictamen'
      responses:
        '201':
          description: Dictamen exportado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/dictamenes/{folioExportacion}:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/FolioExportacion'
    get:
      tags: [dictamenes]
      operationId: obtenerDictamen
      summary: Registro de exportación (productos, estado de revisión y hashes)
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-18-AC-3, RF-19-AC-5]
      responses:
        '200':
          description: Dictamen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/dictamenes/{folioExportacion}/documentos/{formato}:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/FolioExportacion'
      - name: formato
        in: path
        required: true
        schema:
          type: string
          enum: [pdf, xlsx]
    get:
      tags: [dictamenes]
      operationId: descargarDictamen
      summary: Descargar el PDF o el XLSX de un dictamen
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-19-AC-1, RF-19-AC-2, RF-19-AC-3]
      responses:
        '200':
          description: Archivo del dictamen.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/dictamenes/{folioExportacion}/regeneraciones:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/FolioExportacion'
    post:
      tags: [dictamenes]
      operationId: regenerarDictamen
      summary: Volver a generar un dictamen con el estado de su exportación original
      description: Crea un dictamen nuevo, con su propio folio y `regeneradoDe` apuntando al original.
      x-release: 2
      x-roles: [ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-14-AC-6, RF-20-AC-2, RF-27-AC-2, RF-27-AC-4, RF-28-AC-3]
      responses:
        '201':
          description: Dictamen regenerado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dictamen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Los datos del caso se eliminaron ("Datos eliminados el [fecha]").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /dictamenes/{folioExportacion}/verificaciones:
    parameters:
      - $ref: '#/components/parameters/FolioExportacion'
    post:
      tags: [dictamenes]
      operationId: verificarDictamen
      summary: Verificar si un archivo presentado coincide con el folio
      description: |
        Fuera de `/casos` porque el auditor verifica sin acceder al contenido del caso (RNF-04).
        Compara el SHA-256 del archivo presentado con los registrados para el folio.
      x-roles: [ANALISTA, MP_PERITO, AUDITOR]
      x-acceptance-criteria: [RF-19-AC-4]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionDictamen'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /bitacora:
    get:
      tags: [bitacora]
      operationId: consultarBitacora
      summary: Consultar y filtrar la bitácora (auditor)
      x-roles: [AUDITOR]
      x-acceptance-criteria: [RF-01-AC-2, RF-01-AC-3, RF-02-AC-3, RF-02-AC-9, RF-03-AC-4, RF-03-AC-5, RF-05-AC-5, RF-06-AC-3, RF-17-AC-1, RF-21-AC-1, RF-21-AC-2, RF-21-AC-3, RF-22-AC-1, RF-27-AC-4, RF-28-AC-1]
      parameters:
        - name: folio
          in: query
          schema:
            type: string
        - name: desde
          in: query
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          schema:
            type: string
            format: date-time
        - name: tipoAccion
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Página de entradas, en orden de `secuencia`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaBitacora'
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /bitacora/verificaciones:
    post:
      tags: [bitacora]
      operationId: verificarBitacora
      summary: Verificar la cadena de la bitácora, opcionalmente contra un sello diario
      x-roles: [AUDITOR]
      x-acceptance-criteria: [RF-22-AC-3, RF-22-AC-4]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudVerificacionBitacora'
      responses:
        '200':
          description: Resultado de la verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionBitacora'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /bitacora/sellos:
    get:
      tags: [bitacora]
      operationId: listarSellos
      summary: Sellos diarios de la bitácora (el auditor los guarda fuera del servidor)
      x-roles: [AUDITOR]
      x-acceptance-criteria: [RF-22-AC-4]
      responses:
        '200':
          description: Sellos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SelloDiario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /valores-fabrica:
    get:
      tags: [configuracion]
      operationId: obtenerValoresFabrica
      summary: Valores de fábrica vigentes (S-08)
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: []
      responses:
        '200':
          description: Valores vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValoresFabrica'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      tags: [configuracion]
      operationId: cambiarValoresFabrica
      summary: Cambiar los valores de fábrica (coordinador)
      x-release: 2
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-28-AC-1, RF-28-AC-2]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValoresFabrica'
      responses:
        '200':
          description: Valores actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValoresFabrica'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. JWT firmado con HS256; secreto en `JWT_SECRET` y
        vigencia en `JWT_EXPIRATION` (variables de entorno). Claims: `sub` (id del usuario),
        `rol` (rol activo), `iat`, `exp`.

  parameters:
    Folio:
      name: folio
      in: path
      required: true
      description: Folio del caso.
      schema:
        type: string
        example: VIN-2026-000123
    UsuarioId:
      name: usuarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArchivoId:
      name: archivoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CargaId:
      name: cargaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PerfilId:
      name: perfilId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductoId:
      name: productoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FolioExportacion:
      name: folioExportacion
      in: path
      required: true
      schema:
        type: string
        example: EXP-2026-000045
    Cursor:
      name: cursor
      in: query
      description: |
        Valor opaco devuelto en `siguienteCursor` de la página anterior; se omite en la primera.
        Codifica la clave de orden del último elemento (paginación *keyset*), no un desplazamiento.
      schema:
        type: string
    Limite:
      name: limite
      in: query
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  responses:
    SolicitudMalFormada:
      description: JSON o formulario mal formado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: Token ausente, inválido o sesión expirada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    PermisoInsuficiente:
      description: El rol activo no tiene permiso para la operación ("Permiso insuficiente").
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Permiso insuficiente
            status: 403
    NoEncontrado:
      description: El recurso no existe o el usuario no tiene asignado el caso (respuesta idéntica, RNF-02).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    FiltroInvalido:
      description: Parámetro de consulta con formato o valor inválido (fecha, enumeración o cursor).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    Conflicto:
      description: |
        La operación no es compatible con el estado actual del recurso; p. ej. el caso está
        cerrado y es de solo lectura (RF-27-AC-1) o la carga ya no está `PREPARADA`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: El caso está cerrado y es de solo lectura
            status: 409
    NoProcesable:
      description: La solicitud es válida en forma pero viola una regla de validación del dominio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Faltan datos obligatorios
            status: 422
            errores:
              - campo: numeroSolicitud
                mensaje: 'Faltan: número de solicitud'
    ErrorInterno:
      description: Error no previsto; no expone detalles internos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  schemas:
    Salud:
      type: object
      required: [status, postgresql, postgis, timezone]
      properties:
        status:
          type: string
          example: ok
        postgresql:
          type: string
          example: '18.6'
        postgis:
          type: string
          example: 3.6.4
        timezone:
          type: string
          example: UTC

    Problema:
      type: object
      description: Detalle de error según RFC 9457 (antes RFC 7807), application/problem+json.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errores:
          type: array
          items:
            type: object
            required: [mensaje]
            properties:
              campo:
                type: string
              mensaje:
                type: string

    Rol:
      type: string
      enum: [ADMINISTRADOR, COORDINADOR, ANALISTA, MP_PERITO, AUDITOR]
    NuevoUsuario:
      type: object
      additionalProperties: false
      required: [correo, nombreCompleto, contrasena, roles]
      properties:
        correo:
          type: string
          format: email
        nombreCompleto:
          type: string
          minLength: 1
          maxLength: 200
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 72
          description: bcrypt solo usa los primeros 72 bytes; por eso el máximo.
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Rol'

    Usuario:
      type: object
      description: Nunca incluye la contraseña ni su hash.
      required: [id, correo, nombreCompleto, roles, activo, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        correo:
          type: string
          format: email
        nombreCompleto:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        creadoEn:
          type: string
          format: date-time

    Token:
      type: object
      required: [accessToken, tokenType, expiraEn, rolActivo]
      properties:
        accessToken:
          type: string
          description: JWT.
        tokenType:
          type: string
          enum: [Bearer]
        expiraEn:
          type: integer
          description: Segundos de vigencia del token.
        rolActivo:
          $ref: '#/components/schemas/Rol'

    Credenciales:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
          writeOnly: true
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioActual:
      allOf:
        - $ref: '#/components/schemas/Usuario'
        - type: object
          required: [rolActivo]
          properties:
            rolActivo:
              $ref: '#/components/schemas/Rol'

    UsuarioResumen:
      type: object
      required: [id, nombreCompleto, roles]
      properties:
        id:
          type: string
          format: uuid
        nombreCompleto:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Rol'

    ReferenciaUsuario:
      type: object
      required: [usuarioId]
      properties:
        usuarioId:
          type: string
          format: uuid

    EstadoCaso:
      type: string
      enum: [ABIERTO, CERRADO]

    NuevoCaso:
      type: object
      required: [numeroSolicitud, mpSolicitanteId, lineas]
      properties:
        numeroSolicitud:
          type: string
          example: S-100
        mpSolicitanteId:
          type: string
          format: uuid
        analistaId:
          type: string
          format: uuid
        lineas:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/NuevaLinea'

    CambioCaso:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [CERRADO]

    CasoResumen:
      type: object
      required: [folio, numeroSolicitud, estado]
      properties:
        folio:
          type: string
          pattern: ^VIN-\d{4}-\d{6}$
          example: VIN-2026-000123
          readOnly: true
        numeroSolicitud:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCaso'
        analista:
          $ref: '#/components/schemas/UsuarioResumen'

    Caso:
      allOf:
        - $ref: '#/components/schemas/CasoResumen'
        - type: object
          required: [creadoEn, mpSolicitante, lineas]
          properties:
            creadoEn:
              type: string
              format: date-time
            cerradoEn:
              type: string
              format: date-time
              nullable: true
            conservarHasta:
              type: string
              format: date
              nullable: true
            mpSolicitante:
              $ref: '#/components/schemas/UsuarioResumen'
            peritos:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioResumen'
            lineas:
              type: array
              items:
                $ref: '#/components/schemas/LineaObjetivo'

    NuevaLinea:
      type: object
      required: [msisdn]
      properties:
        msisdn:
          type: string
          description: Se normaliza a E.164 (RF-23).
          example: '5512345678'

    LineaObjetivo:
      type: object
      required: [id, msisdn, msisdnMostrado]
      properties:
        id:
          type: string
          format: uuid
        msisdn:
          type: string
          description: E.164.
          example: '+525512345678'
        msisdnMostrado:
          type: string
          example: '5512345678'

    Asignacion:
      type: object
      required: [usuario, funcion, desde]
      properties:
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        funcion:
          type: string
          enum: [MP_SOLICITANTE, ANALISTA, PERITO]
        desde:
          type: string
          format: date-time

    ResumenCaso:
      type: object
      required: [eventos, eventosSinUbicar]
      properties:
        eventos:
          type: integer
        eventosSinUbicar:
          type: integer
        discrepanciasCoordenadas:
          type: array
          items:
            type: object
            required: [cellId, distanciaM]
            properties:
              cellId:
                type: string
              distanciaM:
                type: number
        camposNoDisponibles:
          type: array
          items:
            type: object
            required: [archivoId, campos]
            properties:
              archivoId:
                type: string
                format: uuid
              campos:
                type: array
                items:
                  type: string

    TipoArchivo:
      type: string
      description: '`CATALOGO` (catálogo de radiobases, RF-15) es de release 2.'
      x-release-2-values: [CATALOGO]
      enum: [SABANA, CATALOGO]

    NuevoArchivo:
      type: object
      required: [archivo, tipo, numeroOficio, concesionario, fechaRecepcion]
      properties:
        archivo:
          type: string
          format: binary
        tipo:
          $ref: '#/components/schemas/TipoArchivo'
        numeroOficio:
          type: string
          minLength: 1
        concesionario:
          type: string
          minLength: 1
        fechaRecepcion:
          type: string
          format: date
        confirmarDuplicado:
          type: boolean
          default: false

    Archivo:
      type: object
      required: [id, tipo, numeroOficio, concesionario, fechaRecepcion, sha256, registradoEn]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoArchivo'
        numeroOficio:
          type: string
        concesionario:
          type: string
        fechaRecepcion:
          type: string
          format: date
        nombreOriginal:
          type: string
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        registradoEn:
          type: string
          format: date-time
        ultimaCarga:
          $ref: '#/components/schemas/ReferenciaCarga'
        camposNoDisponibles:
          type: array
          items:
            type: string
          example: [IMSI]

    ReferenciaCarga:
      type: object
      nullable: true
      required: [id, perfilId, perfilVersion, zonaHoraria]
      properties:
        id:
          type: string
          format: uuid
        perfilId:
          type: string
          format: uuid
        perfilVersion:
          type: integer
        zonaHoraria:
          type: string
          example: America/Mexico_City

    VerificacionIntegridad:
      type: object
      required: [resultado, hashRegistrado, hashRecalculado, verificadoEn]
      properties:
        resultado:
          type: string
          enum: [INTEGRO, ALTERADO]
        hashRegistrado:
          type: string
        hashRecalculado:
          type: string
        verificadoEn:
          type: string
          format: date-time

    NuevaCarga:
      type: object
      required: [archivoId, perfilId, perfilVersion, zonaHoraria]
      properties:
        archivoId:
          type: string
          format: uuid
        perfilId:
          type: string
          format: uuid
        perfilVersion:
          type: integer
          minimum: 1
        zonaHoraria:
          type: string
          description: Zona IANA confirmada por el analista (RF-05). No es parte del perfil.
          example: America/Mexico_City

    CambioCarga:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [CONFIRMADA, CANCELADA]

    EstadoCarga:
      type: string
      enum: [PREPARADA, CONFIRMADA, EN_PROCESO, CONCLUIDA, FALLIDA, CANCELADA]

    Carga:
      type: object
      required: [id, archivoId, perfilId, perfilVersion, zonaHoraria, estado]
      properties:
        id:
          type: string
          format: uuid
        archivoId:
          type: string
          format: uuid
        perfilId:
          type: string
          format: uuid
        perfilVersion:
          type: integer
        zonaHoraria:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCarga'
        avance:
          type: number
          minimum: 0
          maximum: 1
        vistaPrevia:
          type: array
          maxItems: 10
          description: Primeras filas interpretadas (RF-04-AC-2).
          items:
            $ref: '#/components/schemas/Evento'
        resumen:
          $ref: '#/components/schemas/ResumenCalidad'
        error:
          type: string
          nullable: true
          description: Motivo si la carga falló; en ese caso no se aplicó ningún cambio (RNF-10).

    ResumenCalidad:
      type: object
      nullable: true
      description: Resumen de calidad al concluir (RF-04-AC-11).
      required: [renglonesOriginales, eventosCargados, noInterpretables, duplicadosMarcados, sinCoordenadas]
      properties:
        renglonesOriginales:
          type: integer
        eventosCargados:
          type: integer
        noInterpretables:
          type: integer
        duplicadosMarcados:
          type: integer
        sinCoordenadas:
          type: integer
        contrapartesNoNumericas:
          type: integer
        camposNoDisponibles:
          type: array
          items:
            type: string

    RenglonNoInterpretable:
      type: object
      required: [numeroRenglon, motivo]
      properties:
        numeroRenglon:
          type: integer
        motivo:
          type: string
          example: Fecha inválida

    TipoEvento:
      type: string
      enum: [VOZ, SMS, DATOS]

    MarcaDuplicado:
      type: string
      enum: [DUPLICADO_EXACTO, FRAGMENTO_SESION]

    Evento:
      type: object
      description: Metadatos de un evento. Sin ningún campo de contenido (RD-01).
      required: [id, archivoId, numeroRenglon, fechaHoraUtc, fechaHoraMostrada, tipo, excluido]
      properties:
        id:
          type: string
          format: uuid
        archivoId:
          type: string
          format: uuid
        numeroRenglon:
          type: integer
        fechaHoraUtc:
          type: string
          format: date-time
          example: '2026-03-15T18:00:00Z'
        fechaHoraMostrada:
          type: string
          format: date-time
          description: En America/Mexico_City (RF-05).
          example: '2026-03-15T12:00:00-06:00'
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        direccion:
          type: string
          enum: [ENTRANTE, SALIENTE]
          nullable: true
        resultado:
          type: string
          enum: [CONTESTADA, NO_CONTESTADA]
          nullable: true
        duracionSeg:
          type: integer
          nullable: true
        msisdnObjetivo:
          type: string
        contraparteOriginal:
          type: string
          nullable: true
          example: 044 55 1234 5678
        contraparteNormalizada:
          type: string
          nullable: true
          example: '+525512345678'
        contraparteNumerica:
          type: boolean
        imei:
          type: string
          nullable: true
          example: '86328012345678'
        imsi:
          type: string
          nullable: true
        ubicacion:
          $ref: '#/components/schemas/UbicacionReportada'
        marca:
          $ref: '#/components/schemas/MarcaDuplicadoNullable'
        excluido:
          type: boolean

    MarcaDuplicadoNullable:
      type: string
      enum: [DUPLICADO_EXACTO, FRAGMENTO_SESION]
      nullable: true

    UbicacionReportada:
      type: object
      nullable: true
      description: |
        Datos de la radiobase tal como vienen en el renglón, ya convertidos (RF-04-AC-9). Es
        insumo para calcular áreas; la API nunca la presenta como posición del equipo (RD-02).
      properties:
        latitud:
          type: number
          nullable: true
          example: 19.425
        longitud:
          type: number
          nullable: true
          example: -99.1375
        azimut:
          type: integer
          nullable: true
        cellId:
          type: string
          nullable: true
        lacTac:
          type: string
          nullable: true
        sinUbicar:
          type: boolean

    CambioEvento:
      type: object
      required: [excluido]
      properties:
        excluido:
          type: boolean

    TraduccionTipo:
      type: object
      required: [valorConcesionario, tipo]
      properties:
        valorConcesionario:
          type: string
          example: VOZ TRANSITO
        tipo:
          $ref: '#/components/schemas/TipoEvento'
        direccion:
          type: string
          enum: [ENTRANTE, SALIENTE]
          nullable: true
        resultado:
          type: string
          enum: [CONTESTADA, NO_CONTESTADA]
          nullable: true

    DefinicionPerfil:
      type: object
      required: [nombre, concesionario, mapeoColumnas, formatoFecha, formatoHora, unidadDuracion, entregaCoordenadas, traducciones]
      properties:
        nombre:
          type: string
          example: Azul
        concesionario:
          type: string
        encabezados:
          type: array
          items:
            type: string
        mapeoColumnas:
          type: object
          description: Campo de VÍNCULO → columna del archivo.
          additionalProperties:
            type: string
          example:
            msisdnObjetivo: Telefono
            fecha: Fecha
            hora: Hora
            duracion: Durac. Seg.
            imei: IMEI
            latitud: LATITUD
            longitud: LONGITUD
            azimut: Azimuth
        contraparte:
          type: object
          properties:
            salienteYDatos:
              type: string
              example: Numero B
            entrante:
              type: string
              example: Numero A
        formatoFecha:
          type: string
          example: dd/mm/aa
        formatoHora:
          type: string
          example: H:MM:SS
        unidadDuracion:
          type: string
          enum: [SEGUNDOS, MINUTOS]
          default: SEGUNDOS
        codificacion:
          type: string
          description: Codificación de los archivos de texto del concesionario (RF-04-AC-4).
          enum: [UTF-8, WINDOWS-1252, ISO-8859-1]
          default: UTF-8
        separador:
          type: string
          nullable: true
          description: Separador de campos para CSV/TXT; null para `.xlsx`.
          maxLength: 1
          example: '|'
        formatoCoordenadas:
          type: string
          enum: [DECIMAL, GMS]
          nullable: true
        entregaCoordenadas:
          type: boolean
          description: false si el concesionario entrega solo Cell ID y LAC/TAC (RF-29-AC-6).
        traducciones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TraduccionTipo'

    NuevoPerfil:
      oneOf:
        - $ref: '#/components/schemas/DefinicionPerfil'
        - type: object
          required: [copiaDe]
          properties:
            copiaDe:
              type: string
              format: uuid

    Perfil:
      type: object
      required: [id, nombre, concesionario, propietario, versionVigente, definicion]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        concesionario:
          type: string
        propietario:
          $ref: '#/components/schemas/UsuarioResumen'
        copiadoDe:
          type: string
          format: uuid
          nullable: true
        versionVigente:
          type: integer
        editable:
          type: boolean
          description: true solo para el propietario (RF-29-AC-5).
        definicion:
          $ref: '#/components/schemas/DefinicionPerfil'

    VersionPerfil:
      type: object
      description: Versión inmutable de un perfil; las cargas la referencian por `perfilVersion`.
      required: [perfilId, version, creadaEn, creadaPor, definicion]
      properties:
        perfilId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        creadaEn:
          type: string
          format: date-time
        creadaPor:
          $ref: '#/components/schemas/UsuarioResumen'
        definicion:
          $ref: '#/components/schemas/DefinicionPerfil'

    PropuestaMapeo:
      type: object
      required: [encabezados, mapeoPropuesto, valoresTipo]
      properties:
        encabezados:
          type: array
          items:
            type: string
        mapeoPropuesto:
          type: object
          additionalProperties:
            type: string
        formatoCoordenadasDetectado:
          type: string
          enum: [DECIMAL, GMS]
          nullable: true
        valoresTipo:
          type: array
          description: Valores distintos de la columna de tipo, a traducir (RF-29-AC-2).
          items:
            type: string

    TipoProducto:
      type: string
      description: |
        `COUBICACION` (RF-11) e `INTERMEDIARIOS` (RF-12) requieren varias líneas con datos y son de
        release 2; en el release 1 (una sola sábana) responden `422`.
      x-release-2-values: [COUBICACION, INTERMEDIARIOS]
      enum: [CONTACTOS, PERNOCTA, DESPLAZAMIENTO, IDENTIFICADORES, RUPTURAS, ACTIVIDAD_DIURNA, VENTANA_ACTIVIDAD, GRAFO, LINEA_TIEMPO, MAPA_AREAS, COUBICACION, INTERMEDIARIOS]

    ParametrosAnalisis:
      type: object
      description: Parámetros declarados en el producto (RD-04). Los omitidos toman el valor de fábrica.
      properties:
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time
        tipoEvento:
          $ref: '#/components/schemas/TipoEvento'
        franja:
          $ref: '#/components/schemas/Franja'
        orden:
          type: string
          enum: [EVENTOS, DURACION]
        top:
          type: integer
          minimum: 1
        minimoEventos:
          type: integer
          minimum: 1
        agregacion:
          type: string
          enum: [DIA, HORA, HORA_DEL_DIA, DIA_SEMANA]
        periodoReferencia:
          type: object
          properties:
            desde:
              type: string
              format: date-time
            hasta:
              type: string
              format: date-time
        umbralSilencioH:
          type: number
        ventanaMin:
          type: integer
        distanciaM:
          type: integer
        incluirExcluidos:
          type: boolean
          default: false

    Franja:
      type: object
      required: [inicio, fin]
      properties:
        inicio:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '22:00'
        fin:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '06:00'

    SolicitudProducto:
      type: object
      required: [tipo, lineaIds]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoProducto'
        lineaIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        parametros:
          $ref: '#/components/schemas/ParametrosAnalisis'

    EstadoRevision:
      type: object
      required: [revisado]
      properties:
        revisado:
          type: boolean
        revisadoPor:
          $ref: '#/components/schemas/UsuarioResumen'
        revisadoEn:
          type: string
          format: date-time
          nullable: true

    Revision:
      type: object
      required: [revisadoPor, revisadoEn]
      properties:
        revisadoPor:
          $ref: '#/components/schemas/UsuarioResumen'
        revisadoEn:
          type: string
          format: date-time

    ProductoResumen:
      type: object
      required: [id, tipo, calculadoEn, revision]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: '#/components/schemas/TipoProducto'
        calculadoEn:
          type: string
          format: date-time
        revision:
          $ref: '#/components/schemas/EstadoRevision'

    Producto:
      allOf:
        - $ref: '#/components/schemas/ProductoResumen'
        - type: object
          required: [lineaIds, parametros, zonaPresentacion, resultado]
          properties:
            lineaIds:
              type: array
              items:
                type: string
                format: uuid
            parametros:
              $ref: '#/components/schemas/ParametrosAnalisis'
            zonaPresentacion:
              type: string
              example: America/Mexico_City
            etiqueta:
              type: string
              description: Texto a mostrar; p. ej. "Zona de pernocta probable" (RF-08-AC-7).
            resultado:
              $ref: '#/components/schemas/ResultadoProducto'
            zonas:
              type: array
              description: Áreas de presencia probable, nunca puntos (RF-14, RD-02).
              items:
                $ref: '#/components/schemas/ZonaCobertura'

    ResultadoProducto:
      description: Resultado según el tipo del producto.
      oneOf:
        - $ref: '#/components/schemas/ResultadoContactos'
        - $ref: '#/components/schemas/ResultadoPernocta'
        - $ref: '#/components/schemas/ResultadoSecuencia'
        - $ref: '#/components/schemas/ResultadoIdentificadores'
        - $ref: '#/components/schemas/ResultadoRupturas'
        - $ref: '#/components/schemas/ResultadoActividad'
        - $ref: '#/components/schemas/ResultadoGrafo'
        - $ref: '#/components/schemas/ResultadoLineaTiempo'
        - $ref: '#/components/schemas/ResultadoCoubicacion'
        - $ref: '#/components/schemas/ResultadoIntermediarios'
        - $ref: '#/components/schemas/ResultadoNoDisponible'

    ResultadoNoDisponible:
      type: object
      description: El producto no se pudo calcular con los datos disponibles (RF-08-AC-8, RF-10-AC-3, RF-12-AC-3).
      required: [disponible, motivo]
      properties:
        disponible:
          type: boolean
          enum: [false]
        motivo:
          type: string
          example: 'Eventos insuficientes en la franja: 9 de un mínimo de 10'

    ResultadoContactos:
      type: object
      required: [totalContactos, contactos]
      properties:
        totalContactos:
          type: integer
          description: Para mostrar "15 de 40 contactos" (RF-07-AC-8).
        contactos:
          type: array
          items:
            type: object
            required: [clave, numeroMostrado, eventos, duracionSeg, entrantes, salientes, reciprocidad]
            properties:
              clave:
                type: string
              numeroMostrado:
                type: string
              eventos:
                type: integer
              duracionSeg:
                type: integer
              entrantes:
                type: integer
              salientes:
                type: integer
              contestadas:
                type: integer
              noContestadas:
                type: integer
              reciprocidad:
                type: string
                enum: [RECIPROCO, SOLO_SALIENTE, SOLO_ENTRANTE]
              primeraComunicacion:
                type: string
                format: date
              ultimaComunicacion:
                type: string
                format: date
              diasConContacto:
                type: integer

    ResultadoPernocta:
      type: object
      required: [nochesConEventos, entreSemana, finDeSemana]
      properties:
        nochesConEventos:
          type: integer
        entreSemana:
          type: array
          description: Una radiobase, o varias si empatan (RF-08-AC-4).
          items:
            $ref: '#/components/schemas/PresenciaRadiobase'
        finDeSemana:
          type: array
          items:
            $ref: '#/components/schemas/PresenciaRadiobase'

    PresenciaRadiobase:
      type: object
      required: [clave, radiobaseId, noches, eventos]
      properties:
        clave:
          type: string
        radiobaseId:
          type: string
        noches:
          type: integer
        dias:
          type: integer
        eventos:
          type: integer

    ResultadoSecuencia:
      type: object
      required: [secuencia]
      properties:
        secuencia:
          type: array
          items:
            type: object
            required: [clave, inicio]
            properties:
              clave:
                type: string
              radiobaseId:
                type: string
                nullable: true
              inicio:
                type: string
                format: date-time
              sinUbicar:
                type: boolean

    ResultadoIdentificadores:
      type: object
      required: [imeis, deteccionCambioChip]
      properties:
        imeis:
          type: array
          items:
            $ref: '#/components/schemas/UsoIdentificador'
        imsis:
          type: array
          items:
            $ref: '#/components/schemas/UsoIdentificador'
        deteccionCambioChip:
          type: object
          required: [habilitada]
          properties:
            habilitada:
              type: boolean
            motivo:
              type: string
              nullable: true
              example: Los archivos de esta línea no traen IMSI
            imeisConVariosImsi:
              type: array
              items:
                type: string

    UsoIdentificador:
      type: object
      required: [clave, valor, primerEvento, ultimoEvento]
      properties:
        clave:
          type: string
        valor:
          type: string
        primerEvento:
          type: string
          format: date-time
        ultimoEvento:
          type: string
          format: date-time

    ResultadoRupturas:
      type: object
      required: [periodoAnalisis, periodoReferencia, rupturas]
      properties:
        periodoAnalisis:
          $ref: '#/components/schemas/Intervalo'
        periodoReferencia:
          $ref: '#/components/schemas/Intervalo'
        rupturas:
          type: array
          items:
            type: object
            required: [clave, tipo]
            properties:
              clave:
                type: string
              tipo:
                type: string
                enum: [SILENCIO, HORARIO_ATIPICO, ZONA_NUEVA]
              intervalo:
                $ref: '#/components/schemas/Intervalo'
              radiobaseId:
                type: string
                nullable: true

    Intervalo:
      type: object
      required: [desde, hasta]
      properties:
        desde:
          type: string
          format: date-time
        hasta:
          type: string
          format: date-time

    ResultadoActividad:
      type: object
      properties:
        actividadDiurna:
          type: array
          items:
            $ref: '#/components/schemas/PresenciaRadiobase'
        ventanaActividad:
          type: object
          properties:
            inicioMediana:
              type: string
              example: '07:30'
            finMediana:
              type: string
              example: '23:00'

    ResultadoGrafo:
      type: object
      required: [nodos, aristas]
      properties:
        nodos:
          type: array
          items:
            type: object
            required: [clave, numeroMostrado, esObjetivo]
            properties:
              clave:
                type: string
              numeroMostrado:
                type: string
              esObjetivo:
                type: boolean
              esIntermediario:
                type: boolean
        aristas:
          type: array
          items:
            type: object
            required: [origen, destino, eventos]
            properties:
              origen:
                type: string
              destino:
                type: string
              eventos:
                type: integer

    ResultadoLineaTiempo:
      type: object
      required: [agregacion, barras]
      properties:
        agregacion:
          type: string
          enum: [DIA, HORA, HORA_DEL_DIA, DIA_SEMANA]
        barras:
          type: array
          items:
            type: object
            required: [clave, etiqueta, eventos]
            properties:
              clave:
                type: string
              etiqueta:
                type: string
              eventos:
                type: integer

    ResultadoCoubicacion:
      type: object
      required: [coincidencias]
      properties:
        coincidencias:
          type: array
          items:
            type: object
            required: [clave, lineas, radiobases, distanciaM, horas]
            properties:
              clave:
                type: string
              lineas:
                type: array
                items:
                  type: string
              radiobases:
                type: array
                items:
                  type: string
              distanciaM:
                type: number
              horas:
                type: array
                items:
                  type: string
                  format: date-time
              sinUbicar:
                type: boolean

    ResultadoIntermediarios:
      type: object
      required: [intermediarios]
      properties:
        intermediarios:
          type: array
          items:
            type: object
            required: [clave, numeroMostrado, eventosPorLinea]
            properties:
              clave:
                type: string
              numeroMostrado:
                type: string
              eventosPorLinea:
                type: object
                additionalProperties:
                  type: integer

    ZonaCobertura:
      type: object
      description: Área de presencia probable (RF-14). La geometría es siempre un polígono.
      required: [radiobaseId, entorno, radioM, forma, geometria]
      properties:
        radiobaseId:
          type: string
        entorno:
          type: string
          enum: [URBANA, RURAL]
        radioM:
          type: integer
        forma:
          type: string
          enum: [CIRCULO, SECTOR_120]
        etiqueta:
          type: string
        geometria:
          $ref: '#/components/schemas/PoligonoGeoJSON'

    PoligonoGeoJSON:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number

    NuevoDictamen:
      type: object
      required: [productoIds]
      properties:
        productoIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    Dictamen:
      type: object
      required: [folioExportacion, folioCaso, exportadoPor, exportadoEn, productos, sha256Pdf, sha256Xlsx]
      properties:
        folioExportacion:
          type: string
        folioCaso:
          type: string
        analista:
          $ref: '#/components/schemas/UsuarioResumen'
        exportadoPor:
          $ref: '#/components/schemas/UsuarioResumen'
        exportadoEn:
          type: string
          format: date-time
        regeneradoDe:
          type: string
          nullable: true
        productos:
          type: array
          items:
            type: object
            required: [productoId, tipo, estadoRevision]
            properties:
              productoId:
                type: string
                format: uuid
              tipo:
                $ref: '#/components/schemas/TipoProducto'
              estadoRevision:
                type: string
                example: Sin revisión del coordinador
        hashesOrigen:
          type: array
          items:
            type: string
        sha256Pdf:
          type: string
        sha256Xlsx:
          type: string

    VerificacionDictamen:
      type: object
      required: [resultado]
      properties:
        resultado:
          type: string
          enum: [COINCIDE, NO_COINCIDE]
        formato:
          type: string
          enum: [pdf, xlsx]
          nullable: true

    EntradaBitacora:
      type: object
      required: [secuencia, fechaHora, tipoAccion, hash, hashAnterior]
      properties:
        secuencia:
          type: integer
        fechaHora:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/UsuarioResumen'
        rolEjercido:
          description: Rol activo con el que se ejecutó la acción; incluye ADMINISTRADOR (R-14).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Rol'
        folioCaso:
          type: string
          nullable: true
        tipoAccion:
          type: string
          example: CARGA
        parametros:
          type: object
          additionalProperties: true
        hashAnterior:
          type: string
        hash:
          type: string

    PaginaBitacora:
      type: object
      required: [elementos, siguienteCursor]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/EntradaBitacora'
        siguienteCursor:
          type: string
          nullable: true
          description: null en la última página.

    PaginaEventos:
      type: object
      required: [elementos, total, siguienteCursor]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Evento'
        total:
          type: integer
          description: Total de eventos que cumplen el filtro (RF-16-AC-1).
        siguienteCursor:
          type: string
          nullable: true
          description: null en la última página.

    SolicitudVerificacionBitacora:
      type: object
      properties:
        sello:
          type: string
          description: Hash del sello diario que el auditor guardó fuera del servidor.
        fecha:
          type: string
          format: date

    VerificacionBitacora:
      type: object
      required: [cadenaIntegra]
      properties:
        cadenaIntegra:
          type: boolean
        primeraEntradaAlterada:
          type: integer
          nullable: true
        coincideConSello:
          type: boolean
          nullable: true

    SelloDiario:
      type: object
      required: [fecha, hashUltimaEntrada]
      properties:
        fecha:
          type: string
          format: date
        hashUltimaEntrada:
          type: string

    ValoresFabrica:
      type: object
      required: [franjaNocturna, franjaLaboral, radioUrbanoM, radioRuralM, distanciaUrbanaM, umbralSilencioH, minimoEventosPernocta, ventanaCoubicacionMin, distanciaCoubicacionM]
      properties:
        franjaNocturna:
          $ref: '#/components/schemas/Franja'
        franjaLaboral:
          $ref: '#/components/schemas/Franja'
        radioUrbanoM:
          type: integer
          example: 1000
        radioRuralM:
          type: integer
          example: 5000
        distanciaUrbanaM:
          type: integer
          example: 2000
        umbralSilencioH:
          type: number
          example: 12
        minimoEventosPernocta:
          type: integer
          example: 10
        ventanaCoubicacionMin:
          type: integer
          example: 15
        distanciaCoubicacionM:
          type: integer
          example: 500
