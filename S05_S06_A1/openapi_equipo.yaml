openapi: 3.0.3
info:
  title: VÍNCULO API — contrato consolidado del Equipo 3
  version: 1.1.0
  description: |
    Contrato de la API REST de VÍNCULO, sistema de análisis de sábanas telefónicas (CDR).
    Especificación *spec-first*. Contrato consolidado del Equipo 3 (S05-S06-A1): parte de
    `S04_A2/openapi.yaml` de J. B. Oviedo, base acordada por el equipo el 2026-10-24, con las
    resoluciones documentadas en `S05_S06_A1/diferencias_diseno.md`. Fuente de verdad del
    backend (`backend/`) y de las pruebas (S09).

    - Requerimientos: `S03_A1/SRS_equipo.md`. Cada operación declara en
      `x-acceptance-criteria` los criterios Given-When-Then que satisface.
    - Arquitectura: `S04_A1/decision_arquitectonica.md` (ADR-001 a ADR-003).
    - Las operaciones de siguientes releases se marcan con `x-release: 2`.

    Reglas de dominio que el contrato hace cumplir:
    - **RD-01:** ningún esquema tiene campos de contenido de comunicaciones.
    - **RD-02:** las ubicaciones se devuelven solo como áreas (`Polygon` de GeoJSON), nunca como
      punto.
    - **RNF-02:** un caso no asignado responde exactamente igual que un caso inexistente (`404`).
    - Fechas en ISO 8601 con zona (`date-time`); los eventos se guardan en UTC (RF-05).

    Convenciones (revisión REST, `S04_A2/revision_rest.md`):
    - Rutas con sustantivos en plural y kebab-case; las acciones se modelan como recursos
      (`/verificaciones`, `/regeneraciones`, `/versiones`, `/revision`).
    - Colecciones grandes con paginación por cursor (`cursor`, `limite`).
    - `409` para conflictos con el estado del recurso; `422` para reglas de validación del dominio.

    Seguridad:
    - Todas las operaciones exigen `BearerAuth` salvo las que declaran `security: []`.
    - `x-roles` lista los roles activos que pueden ejecutar la operación (matriz de RNF-01).
      Un token válido con otro rol recibe `403`. El token lleva un solo rol activo (D-2).
    - Errores en `application/problem+json` (RFC 9457): `400` si el cuerpo no cumple el
      esquema, `422` si viola una regla del dominio.
  contact:
    name: Equipo 3 — F. L. Armendáriz, J. F. González, J. B. Oviedo, M. Sánchez
  license:
    name: Uso académico (TC4016, Tecnológico de Monterrey)
    url: https://github.com/CLA-TC4016-SN2026/TC4016-03
servers:
  - url: /api
    description: |
      A través de nginx (`vinculo/frontend/nginx.conf`), que quita el prefijo `/api`.
      La API nativa en desarrollo (`127.0.0.1:8000`) expone las rutas sin `/api`.
security:
  - BearerAuth: []
tags:
  - name: salud
    description: Disponibilidad del servicio (operación)
  - name: auth
    description: Registro (solo administrador), inicio de sesión y usuario actual (RF-01)
  - name: usuarios
    description: Consulta de usuarios para asignaciones (las cuentas las crea el administrador técnico, S-07)
  - name: casos
    description: Casos, líneas objetivo y asignaciones (RF-02, RF-27)
  - name: archivos
    description: Registro y verificación del archivo original (RF-03, RF-15)
  - name: cargas
    description: Carga con perfil y zona horaria; ejecución asíncrona en el worker (RF-04, RF-05, RF-23)
  - name: eventos
    description: Eventos normalizados y decisiones sobre duplicados (RF-06, RF-23)
  - name: perfiles
    description: Perfiles de concesionario versionados (RF-29)
  - name: productos
    description: Productos de análisis (RF-07 a RF-14, RF-16, RF-18, RF-24 a RF-26)
  - name: dictamenes
    description: Exportación, regeneración y verificación de dictámenes (RF-19, RF-20)
  - name: bitacora
    description: Bitácora encadenada y sellos diarios (RF-21, RF-22, RNF-05)
  - name: configuracion
    description: Valores de fábrica (RF-28)

paths:
  /health:
    servers:
      - url: /api
        description: Sin versión; también lo usa el healthcheck de Docker Compose.
    get:
      tags: [salud]
      operationId: obtenerSalud
      summary: Salud de la API y de su conexión a PostgreSQL/PostGIS
      description: Ya implementado (`vinculo/backend/src/api/health.py`). No expone detalles del error.
      security: []
      x-roles: []
      x-acceptance-criteria: []
      responses:
        '200':
          description: API viva y base accesible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          description: Base de datos no disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Base de datos no disponible

  /auth/register:
    post:
      tags: [auth]
      operationId: registrarUsuario
      summary: Crear una cuenta (solo administrador)
      description: |
        La contraseña se guarda como hash bcrypt y nunca aparece en la respuesta.
      x-roles: [ADMINISTRADOR]
      x-acceptance-criteria: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoUsuario'
      responses:
        '201':
          description: Cuenta creada.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /auth/login:
    post:
      tags: [auth]
      operationId: iniciarSesion
      summary: Iniciar sesión y obtener el JWT
      description: |
        Correo inexistente, contraseña incorrecta, cuenta inactiva y rol no asignado reciben la
        misma respuesta `401` (RF-01-AC-3). `rol` solo es obligatorio si la cuenta tiene más de
        un rol.
      security: []
      x-roles: []
      x-acceptance-criteria: [RF-01-AC-1, RF-01-AC-3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      responses:
        '200':
          description: Credenciales válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          description: Credenciales incorrectas (misma respuesta para cualquier causa).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /auth/me:
    get:
      tags: [auth]
      operationId: usuarioActual
      summary: Datos del usuario autenticado y su rol activo
      x-roles: [ADMINISTRADOR, COORDINADOR, ANALISTA, MP_PERITO, AUDITOR]
      x-acceptance-criteria: [RF-01-AC-1]
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioActual'
        '401':
          $ref: '#/components/responses/NoAutenticado'

        '500':
          $ref: '#/components/responses/ErrorInterno'
  /usuarios:
    get:
      tags: [usuarios]
      operationId: listarUsuarios
      summary: Listar usuarios activos de la unidad
      description: Solo coordinador. Sirve para elegir analistas, MP y peritos al asignar.
      x-roles: [COORDINADOR]
      x-acceptance-criteria: []
      parameters:
        - name: rol
          in: query
          schema:
            $ref: '#/components/schemas/Rol'
      responses:
        '200':
          description: Usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumen'
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos:
    get:
      tags: [casos]
      operationId: listarCasos
      summary: Mis casos (o todos los de la unidad, para el coordinador)
      description: |
        Analista, MP y perito ven solo los casos que tienen asignados. El coordinador ve todos y
        puede filtrar los que no tienen analista (RF-02-AC-6). El auditor no lista casos (RNF-04).
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-6, RF-02-AC-7, RF-17-AC-1]
      parameters:
        - name: sinAnalista
          in: query
          schema:
            type: boolean
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoCaso'
      responses:
        '200':
          description: Casos visibles para el rol activo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CasoResumen'
        '400':
          $ref: '#/components/responses/FiltroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [casos]
      operationId: crearCaso
      summary: Crear un caso a partir de la solicitud del MP
      description: Solo coordinador (RF-02-AC-8).
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-2, RF-02-AC-8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoCaso'
      responses:
        '201':
          description: Caso creado.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caso'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}:
    parameters:
      - $ref: '#/components/parameters/Folio'
    get:
      tags: [casos]
      operationId: obtenerCaso
      summary: Detalle de un caso
      description: |
        Un caso no asignado y un folio inexistente reciben respuestas idénticas (`404`), y el
        intento queda como "acceso rechazado" en la bitácora (RF-02-AC-9, RNF-02).
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-02-AC-5, RF-02-AC-9, RF-17-AC-1, RF-21-AC-2]
      responses:
        '200':
          description: Caso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caso'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    patch:
      tags: [casos]
      operationId: actualizarCaso
      summary: Cerrar el caso
      description: |
        Solo coordinador. El único cambio admitido es `estado: CERRADO`. Un caso cerrado es de
        solo lectura (RF-27-AC-1).
      x-release: 2
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-27-AC-1]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioCaso'
      responses:
        '200':
          description: Caso actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caso'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/datos:
    parameters:
      - $ref: '#/components/parameters/Folio'
    delete:
      tags: [casos]
      operationId: eliminarDatosCaso
      summary: Eliminar eventos y copias de originales al vencer el plazo de conservación
      description: |
        Solo coordinador y solo con el caso cerrado y el plazo de S-13 vencido. La bitácora, los
        hashes y los registros de exportación se conservan (RF-27-AC-4).
      x-release: 2
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-27-AC-3, RF-27-AC-4]
      responses:
        '204':
          description: Datos eliminados.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: El caso no está cerrado o el plazo de conservación no ha terminado; indica la fecha en que termina.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/lineas:
    parameters:
      - $ref: '#/components/parameters/Folio'
    get:
      tags: [casos]
      operationId: listarLineas
      summary: Líneas objetivo del caso
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-02-AC-3]
      responses:
        '200':
          description: Líneas objetivo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineaObjetivo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [casos]
      operationId: agregarLinea
      summary: Agregar una línea objetivo (máximo 20)
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-02-AC-3, RF-02-AC-4]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaLinea'
      responses:
        '201':
          description: Línea agregada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineaObjetivo'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/analista:
    parameters:
      - $ref: '#/components/parameters/Folio'
    put:
      tags: [casos]
      operationId: asignarAnalista
      summary: Asignar o reasignar el analista del caso
      description: |
        Idempotente. El analista anterior pierde el acceso desde su siguiente petición, aunque
        tenga la sesión abierta (RNF-03).
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-02-AC-1, RF-02-AC-5, RF-02-AC-8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenciaUsuario'
      responses:
        '200':
          description: Asignación vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignacion'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    delete:
      tags: [casos]
      operationId: retirarAnalista
      summary: Retirar el caso al analista sin reasignarlo
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-02-AC-6, RF-02-AC-8]
      responses:
        '204':
          description: El caso queda sin analista.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/peritos:
    parameters:
      - $ref: '#/components/parameters/Folio'
    post:
      tags: [casos]
      operationId: asignarPerito
      summary: Asignar un perito adicional
      x-roles: [COORDINADOR]
      x-acceptance-criteria: [RF-02-AC-7]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenciaUsuario'
      responses:
        '201':
          description: Perito asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignacion'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/peritos/{usuarioId}:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/UsuarioId'
    delete:
      tags: [casos]
      operationId: retirarPerito
      summary: Retirar a un perito del caso
      x-roles: [COORDINADOR]
      x-acceptance-criteria: []
      responses:
        '204':
          description: Perito retirado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/resumen:
    parameters:
      - $ref: '#/components/parameters/Folio'
    get:
      tags: [casos]
      operationId: obtenerResumenCaso
      summary: Resumen de calidad de datos del caso
      description: Eventos sin ubicar, discrepancias de coordenadas y campos no disponibles por archivo.
      x-roles: [COORDINADOR, ANALISTA, MP_PERITO]
      x-acceptance-criteria: [RF-15-AC-1, RF-15-AC-2, RF-15-AC-4, RF-29-AC-6]
      x-nonfunctional: [RNF-19]
      responses:
        '200':
          description: Resumen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenCaso'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/archivos:
    parameters:
      - $ref: '#/components/parameters/Folio'
    get:
      tags: [archivos]
      operationId: listarArchivos
      summary: Archivos registrados en el caso
      x-roles: [COORDINADOR, ANALISTA]
      x-acceptance-criteria: [RF-15-AC-3]
      responses:
        '200':
          description: Archivos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Archivo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      tags: [archivos]
      operationId: registrarArchivo
      summary: Registrar un archivo original (sábana o catálogo)
      description: |
        Guarda la copia sin modificar y calcula su SHA-256. Si el caso ya tiene un archivo con el
        mismo hash, responde `409` y solo lo registra si se reenvía con `confirmarDuplicado=true`
        (RF-03-AC-5). Solo analista del caso; un MP recibe `403` y se registra el acceso rechazado
        (RF-01-AC-2). Con el caso cerrado responde `409` (RF-27-AC-1).
      x-roles: [ANALISTA]
      x-acceptance-criteria: [RF-01-AC-2, RF-03-AC-1, RF-03-AC-2, RF-03-AC-5, RF-15-AC-3, RF-27-AC-1]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevoArchivo'
      responses:
        '201':
          description: Archivo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archivo'
        '400':
          $ref: '#/components/responses/SolicitudMalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoInsuficiente'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Ya existe un archivo con el mismo hash en el caso (requiere `confirmarDuplicado=true`), o el caso está cerrado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          $ref: '#/components/responses/NoProcesable'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /casos/{folio}/archivos/{archivoId}:
    parameters:
      - $ref: '#/components/parameters/Folio'
      - $ref: '#/components/parameters/ArchivoId'
    get:
      tags: [archivos]
      operationId: obtenerArchivo
      summary: Registro de un archivo (oficio, hash, zona y perfil de su carga)
      x-roles: [COORDINADOR, ANALISTA]
      x-acceptance-criteria: [RF-03-AC-2, RF-04-AC-6, RF-05-AC-5, RF-29-AC-4]
      responses:
        '200':
          description: Archivo.
          content:
